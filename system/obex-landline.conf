# Complément de l'unité obex.service (obexd de BlueZ, session de l'utilisateur)
# posé par scripts/install-local.sh dans
# ~/.config/systemd/user/obex.service.d/landline.conf.
#
# obexd 5.87 s'arrête en erreur (« obex_server_init failed ») s'il démarre
# avant que logind dise la session active : son transport Bluetooth n'est
# alors pas encore enregistré. Sans ce complément, il reste mort jusqu'à la
# session suivante, et avec lui les messages et les contacts.
# Il est donc relancé, dix fois au plus en cinq minutes.
# Voir docs/moteur-reconnexion.md §16.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=10
# Figé dans cette attente, il ignore l'arrêt demandé : 53 s le 18 novembre
# avant de quitter. Il est tué au bout de 5 s pour revenir vite.
TimeoutStopSec=5
