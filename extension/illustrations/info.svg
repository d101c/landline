<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 220 220" font-family="sans-serif">
  <!-- iPhone (iOS 26), Settings › Bluetooth › ⓘ next to this computer, top to
       bottom as on the real page: Show Message Notifications (switch, with its
       footnote), Sync Contacts (switch, footnote), the Groups section (Phone
       Favorites, Recents, All Contacts), Device Type, the System Notifications
       section with Share System Notifications (switch), Forget This Device.
       There is no Name row on that page. A template: {{host}};
       {{tm}} {{km}} {{rm}}, {{tc}} {{kc}} {{rc}}, {{tn}} {{kn}} {{rn}} (track
       colour, knob position, amber ring) for the messages, contacts and
       notifications switches; {{sharing}} and {{lowerDy}} to leave out what
       the iPhone does not show when this computer offers neither messages nor
       contacts; {{rf}} for the ring around Forget This Device; {{L_…}} for
       the words of the iPhone, in its language. -->
  <rect x="5" y="4" width="210" height="260" rx="27" fill="#1c1c1e" stroke="#77777c" stroke-width="3"/>
  <rect x="89" y="11" width="42" height="10" rx="5" fill="#000000"/>
  <text x="18" y="33" font-size="6.800" fill="#0a84ff">‹ {{L_bluetooth}}</text>
  <text x="18" y="47" font-size="12" font-weight="bold" fill="#ffffff">{{host}}</text>
  <g opacity="{{sharing}}">
    <rect x="14" y="52" width="192" height="14" rx="5" fill="#2c2c2e"/>
    <text x="20" y="61.400" font-size="6.800" fill="#ffffff">{{L_showNotifications}}</text>
    <rect x="178" y="53" width="22" height="12" rx="6" fill="{{tm}}"/>
    <circle cx="{{km}}" cy="59" r="4.600" fill="#ffffff"/>
    <rect x="175" y="50.500" width="28" height="17" rx="8.500" fill="none" stroke="#f2b45c" stroke-width="1.800" opacity="{{rm}}"/>
    <text x="20" y="72" font-size="4.300" fill="#8e8e93">{{L_showFooter}}</text>
    <rect x="14" y="77" width="192" height="14" rx="5" fill="#2c2c2e"/>
    <text x="20" y="86.400" font-size="6.800" fill="#ffffff">{{L_syncContacts}}</text>
    <rect x="178" y="78" width="22" height="12" rx="6" fill="{{tc}}"/>
    <circle cx="{{kc}}" cy="84" r="4.600" fill="#ffffff"/>
    <rect x="175" y="75.500" width="28" height="17" rx="8.500" fill="none" stroke="#f2b45c" stroke-width="1.800" opacity="{{rc}}"/>
    <text x="20" y="97" font-size="4.300" fill="#8e8e93">{{L_contactsFooter}}</text>
    <g opacity="0.550">
      <text x="20" y="106.500" font-size="4.600" fill="#8e8e93">{{L_groups}}</text>
      <rect x="14" y="109" width="192" height="36" rx="5" fill="#2c2c2e"/>
      <path d="M20 121H206M20 133H206" stroke="#3a3a3c" stroke-width="0.700"/>
      <g font-size="6.800" fill="#ffffff">
        <text x="20" y="117.400">{{L_favorites}}</text>
        <text x="20" y="129.400">{{L_recents}}</text>
        <text x="20" y="141.400">{{L_allContacts}}</text>
      </g>
      <g fill="none" stroke="#0a84ff" stroke-width="1.200" stroke-linecap="round" stroke-linejoin="round">
        <path d="M193 115l2.200 2.400 4.200-5M193 127l2.200 2.400 4.200-5M193 139l2.200 2.400 4.200-5"/>
      </g>
    </g>
  </g>
  <g transform="translate(0,{{lowerDy}})">
    <g opacity="0.550">
      <rect x="14" y="150" width="192" height="13" rx="5" fill="#2c2c2e"/>
      <text x="20" y="158.900" font-size="6.800" fill="#ffffff">{{L_deviceType}}</text>
      <path d="M197 153.500l3 3-3 3" fill="none" stroke="#98989f" stroke-width="1.100" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="20" y="171.500" font-size="4.600" fill="#8e8e93">{{L_systemNotifications}}</text>
    <rect x="14" y="174" width="192" height="14" rx="5" fill="#2c2c2e"/>
    <text x="20" y="183.400" font-size="6.800" fill="#ffffff">{{L_shareNotifications}}</text>
    <rect x="178" y="175" width="22" height="12" rx="6" fill="{{tn}}"/>
    <circle cx="{{kn}}" cy="181" r="4.600" fill="#ffffff"/>
    <rect x="175" y="172.500" width="28" height="17" rx="8.500" fill="none" stroke="#f2b45c" stroke-width="1.800" opacity="{{rn}}"/>
    <rect x="14" y="194" width="192" height="14" rx="5" fill="#2c2c2e"/>
    <text x="20" y="203.400" font-size="6.800" fill="#0a84ff">{{L_forget}}</text>
    <rect x="11.500" y="191.500" width="197" height="19" rx="7.500" fill="#f2b45c" fill-opacity="0.150" stroke="#f2b45c" stroke-width="1.800" opacity="{{rf}}"/>
  </g>
</svg>
