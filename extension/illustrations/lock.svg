<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 200 220" font-family="sans-serif">
  <!-- iPhone, lock screen with a Messages notification. A template: {{title}} and
       {{text}} are filled in by lib/illustrations.js. -->
  <rect x="10" y="6" width="180" height="260" rx="27" fill="#1c1c1e" stroke="#77777c" stroke-width="3"/>
  <rect x="79" y="15" width="42" height="11" rx="5.5" fill="#000000"/>
  <text x="100" y="46" font-size="8" text-anchor="middle" fill="#d1d1d6">{{L_date}}</text>
  <text x="100" y="84" font-size="36" font-weight="bold" text-anchor="middle" fill="#ffffff">9:41</text>
  <rect x="20" y="106" width="160" height="46" rx="12" fill="#2c2c2e"/>
  <rect x="27" y="117" width="24" height="24" rx="6.500" fill="#34c759"/>
  <path d="M39 122.500c-4.400 0-8 2.800-8 6.300 0 2 1.200 3.800 3.100 4.900-.200 1-.800 2-1.500 2.700 1.700-.100 3.200-.700 4.300-1.500.700.100 1.400.200 2.100.200 4.400 0 8-2.800 8-6.300s-3.600-6.300-8-6.300z" fill="#ffffff"/>
  <text x="58" y="126.500" font-size="8.500" font-weight="bold" fill="#ffffff">{{title}}</text>
  <text x="173" y="126" font-size="6.800" text-anchor="end" fill="#98989f">{{L_now}}</text>
  <text x="58" y="139" font-size="8" fill="#ebebf5">{{text}}</text>
</svg>
